name: Poly Day release web editor

on:
  push:
    branches: [ "release_**" ]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      REACT_APP_GATEWAY_HOST: ws://localhost:8181/websocket
      REACT_APP_AUTHENTICATE_HOST: http://localhost:8080

    steps:
      - name: Preparing git branch
        uses: actions/checkout@v3
        with:
          submodules: 'recursive'

      - name: Install NodeJS
        uses: actions/setup-node@v3
        with:
          node-version: 16

      - name: Install dependencies
        run: make install-dependencies

      - name: Unit test
        run: make test

      - name: Build binary
        run: make build

      - name: Login into docker
        run: docker login -u ${{secrets.DOCKER_USERNAME}} -p ${{secrets.DOCKER_ACCESS_TOKEN}}

      - name: Build docker image
        run: docker build -t ${{secrets.DOCKER_USERNAME}}/poly_day_web_editor:${{github.ref_name}} .

      - name: Push docker tag
        run: docker push ${{secrets.DOCKER_USERNAME}}/poly_day_web_editor:${{github.ref_name}}

      - name: Success result
        if: ${{ success() }}
        run: |
          curl \
            -X POST https://api.telegram.org/bot${{secrets.TELEGRAM_BOT_TOKEN}}/sendMessage?chat_id=${{secrets.TELEGRAM_CHAT_ID}} \
            --header "Content-Type:application/json" \
            --data '{"text":"Project: web-editor\nVersion: ${{github.ref_name}}\nRelease: Success ✅\nTriggered by: ${{github.event.pusher.email}}"}'

      - name: Failure result
        if: ${{ failure() }}
        run: |
          curl \
            -X POST https://api.telegram.org/bot${{secrets.TELEGRAM_BOT_TOKEN}}/sendMessage?chat_id=${{secrets.TELEGRAM_CHAT_ID}} \
            --header "Content-Type:application/json" \
            --data '{"text":"Project: web-editor\nVersion: ${{github.ref_name}}\nRelease: Failed ❌\nTriggered by: ${{github.event.pusher.email}}"}'