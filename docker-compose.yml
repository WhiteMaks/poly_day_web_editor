version: "3.8"

services:

  poly_day_service_bus:
    image: rabbitmq:3-management-alpine
    container_name: poly_day_service_bus
    environment:
      RABBITMQ_DEFAULT_USER: "user"
      RABBITMQ_DEFAULT_PASS: "password"
    ports:
      - "5672:5672"
      - "15672:15672"

  poly_day_bus_schema:
    image: whitemaks/poly_day_bus_schema:release_0.0.4
    container_name: poly_day_bus_schema
    environment:
      RABBIT_CONNECTING_STRING: "amqp://user:password@poly_day_service_bus:5672"
    restart: on-failure

  poly_day_microservice_authenticate_postgresql:
    image: postgres:14.2-alpine
    container_name: poly_day_microservice_authenticate_postgresql
    environment:
      POSTGRES_DB: "authenticate"
      POSTGRES_USER: "user"
      POSTGRES_PASSWORD: "password"
      PGDATA: "/var/lib/postgresql/data/.database"
    volumes:
      - .:/var/lib/postgresql/data
    ports:
      - "15432:5432"

  poly_day_microservice_authenticate_migrator:
    image: whitemaks/poly_day_microservice_authenticate_migrator:release_0.1.0
    container_name: poly_day_microservice_authenticate_migrator
    environment:
      POSTGRES_CONNECTING_STRING: "postgres://user:password@poly_day_microservice_authenticate_postgresql:5432/authenticate?sslmode=disable"
    restart: on-failure

  poly_day_microservice_authenticate_app:
    image: whitemaks/poly_day_microservice_authenticate:release_0.1.0
    container_name: poly_day_microservice_authenticate_app
    environment:
      POSTGRES_CONNECTING_STRING: "postgres://user:password@poly_day_microservice_authenticate_postgresql:5432/authenticate?sslmode=disable"
      RABBIT_CONNECTING_STRING: "amqp://user:password@poly_day_service_bus:5672"
      APP_PORT: "8080"
    ports:
      - "8080:8080"
    restart: on-failure

  poly_day_microservice_gateway_app:
    image: whitemaks/poly_day_microservice_gateway:release_0.0.2
    container_name: poly_day_microservice_gateway_app
    environment:
      RABBIT_CONNECTING_STRING: "amqp://user:password@poly_day_service_bus:5672"
      APP_PORT: "8181"
    ports:
      - "8181:8181"
    restart: on-failure